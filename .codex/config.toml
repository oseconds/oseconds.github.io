#:schema https://developers.openai.com/codex/config-schema.json

# model = "gpt-6-sol"
sandbox_mode = "workspace-write"
approval_policy = "on-request"

web_search = "live"
model_verbosity = "high"
model_reasoning_summary = "detailed"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6-luna"
default_subagent_reasoning_effort = "medium"
interrupt_message = true

[agents.implementation_worker]
description = "Bounded GPT-6 Luna implementation worker for explicitly scoped portfolio work in src/routes/(portfolio)/ and portfolio-specific library/media code; preserves the route-group and Canvas boundaries."
config_file = "agents/implementation_worker.toml"

[agents.regression_review]
description = "Read-only GPT-6 Luna post-edit reviewer for the (portfolio) route group, Canvas navigation isolation, SvelteKit static routing, media, accessibility, and scope regressions."
config_file = "agents/regression_review.toml"